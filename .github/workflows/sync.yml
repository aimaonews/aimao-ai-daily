name: 🐾 Auto Sync AIMao Posts

on:
  schedule:
    # 每 6 小时自动执行一次 (UTC 0:00, 6:00, 12:00, 18:00 -> 北京时间 08:00, 14:00, 20:00, 02:00)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 GitHub 网页一键手动触发
  repository_dispatch: # 支持 WordPress 发布新文章时 Webhook 触发
    types: [new_post]

# 授予 GITHUB_TOKEN 写权限以允许提交代码回仓库
permissions:
  contents: write

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行自动化同步脚本
        env:
          WP_API_URL: https://www.aimao.today/wp-json/wp/v2/posts?per_page=10
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 sync_posts.py
